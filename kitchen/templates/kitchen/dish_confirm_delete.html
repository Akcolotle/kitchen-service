{% extends "layouts/base.html" %}

{% block title %}
Delete dish
{% endblock %}

{% block content %}
  <h2>Delete dish</h2>

  <p>
    Are you sure you want to delete
    <strong>{{ object.name }}</strong>?
  </p>

  <form method="post">
    {% csrf_token %}
    <button type="submit">Yes, delete</button>
    <a href="{% url 'dish-detail' object.pk %}">Cancel</a>
  </form>
{% endblock %}
