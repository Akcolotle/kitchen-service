{% extends "kitchen/base.html" %}

{% block title %}
  {% if object %}
    Edit dish
  {% else %}
    Create dish
  {% endif %}
{% endblock %}

{% block content %}
  <h2>
    {% if object %}
      Edit dish
    {% else %}
      Create dish
    {% endif %}
  </h2>

  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}

    <button type="submit">
      {% if object %}
        Update
      {% else %}
        Create
      {% endif %}
    </button>
  </form>

  <p>
    <a href="{% url 'dish-list' %}">← Back to dishes</a>
  </p>
{% endblock %}
